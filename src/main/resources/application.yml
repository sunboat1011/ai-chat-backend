# ==========================================
# AI Chat Backend - Application Config
# Stage 0: 最小化配置,仅启动 Web + Actuator
# 数据库/JWT/AI 等模块化配置在对应 Stage 引入
# ==========================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-chat-backend
  profiles:
    active: dev

# ----- Actuator 健康检查暴露 -----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ----- MyBatis-Plus -----
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.aichat.**.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  global-config:
    db-config:
      id-type: input
      insert-strategy: not_null
      update-strategy: not_null

# ----- Datasource (values overridden in dev/test profiles) -----
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/aichat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${MYSQL_USER:aichat}
    password: ${MYSQL_PASSWORD:aichat}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ----- Flyway -----
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ----- AI Encryption -----
ai:
  encryption:
    key: ${AI_ENCRYPTION_KEY:}

# ----- JWT -----
jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800

# ----- Logging -----
logging:
  level:
    root: INFO
    com.example.aichat: INFO
    org.springframework.web: INFO
