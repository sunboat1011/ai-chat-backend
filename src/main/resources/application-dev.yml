# ==========================================
# AI Chat Backend - dev profile overrides
# Stage 1: dev-only encryption key + Jackson 配置
# 数据库配置（datasource / flyway）在 Stage 2 引入
# ==========================================

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  datasource:
    url: "jdbc:mysql://localhost:3306/ai_chat?characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Dev-only AES key: Base64(0x00 * 32)
ai:
  encryption:
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Dev-only JWT secret (minimum 256 bits for HS256)
jwt:
  secret: dev-secret-key-must-be-at-least-32-characters-long-for-hs256

logging:
  level:
    com.example.aichat: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
